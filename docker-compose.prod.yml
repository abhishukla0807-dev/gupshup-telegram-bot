version: '3.8'

networks:
  matchmaker_net:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: matchmaker_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matchmaker_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-matchmaker_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - matchmaker_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matchmaker_user} -d ${POSTGRES_DB:-matchmaker_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: matchmaker_redis
    restart: always
    command: redis-server --appendonly yes --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - matchmaker_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: matchmaker_bot
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-matchmaker_user}:${POSTGRES_PASSWORD:-secretpassword}@postgres:5432/${POSTGRES_DB:-matchmaker_db}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    networks:
      - matchmaker_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

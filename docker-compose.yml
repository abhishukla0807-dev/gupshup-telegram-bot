version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: matchmaker_postgres
    environment:
      POSTGRES_USER: matchmaker_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: matchmaker_db
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: matchmaker_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
